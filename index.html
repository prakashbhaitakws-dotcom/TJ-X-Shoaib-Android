<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117"><link rel="manifest" href="manifest.json">
<title>TJ X Shoaib — Mobile Watermark Remover</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#c9d1d9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:760px;margin:auto;padding:14px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:15px;margin-bottom:12px}.title{font-size:22px;font-weight:800;color:#58a6ff}.sub{font-size:12px;color:#8b949e;margin-top:3px}.pill{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:20px;background:#1f362d;color:#3fb950;border:1px solid #238636;font-size:12px;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn,select,input{width:100%;min-height:46px;border-radius:9px;border:1px solid #30363d;background:#21262d;color:#f0f6fc;padding:10px;font-size:14px}.btn{font-weight:700}.primary{background:#1f6feb;border-color:#388bfd}.green{background:#238636;border-color:#2ea043}.danger{background:#da3633;border-color:#f85149}.small{font-size:12px;color:#8b949e}.coords{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.hidden{display:none}.files{max-height:260px;overflow:auto}.file{padding:9px 0;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;gap:8px;font-size:13px}.status{color:#8b949e}.ok{color:#3fb950}.err{color:#f85149}progress{width:100%;height:20px}label{display:block;font-size:12px;color:#8b949e;margin:9px 0 5px}h3{margin:0 0 10px;font-size:15px;color:#f0f6fc}@media(max-width:520px){.row{grid-template-columns:1fr}.coords{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main>
<section class="card"><div class="title">✨ TJ X Shoaib</div><div class="sub">Mobile Watermark Remover & Batch Video Processor</div><div class="pill" id="engine">🟡 Loading FFmpeg engine…</div></section>
<section class="card"><h3>Videos</h3><input id="picker" type="file" accept="video/*" multiple><div class="small" style="margin-top:8px">Select one or many videos from your phone.</div><div class="files" id="fileList"></div></section>
<section class="card"><h3>Removal Settings</h3><label>Removal Method</label><select id="method"><option value="delogo">✨ Delogo — blur/erase box</option><option value="crop">✂️ Crop — cut bottom strip</option></select>
<label>Preset</label><select id="preset"><option value="dola">🎯 Dola AI Default (540,1220,170x50)</option><option value="tiktok">📱 TikTok / CapCut (850,1700,200x80)</option><option value="top">🔝 Top-Right Logo (1650,50,220x100)</option><option value="custom">⚙️ Custom Box Coordinates</option></select>
<div id="delogoBox"><label>Coordinates (X / Y / Width / Height)</label><div class="coords"><input id="x" value="540" inputmode="numeric"><input id="y" value="1220" inputmode="numeric"><input id="w" value="170" inputmode="numeric"><input id="h" value="50" inputmode="numeric"></div></div>
<div id="cropBox" class="hidden"><label>Bottom Cut Height (pixels)</label><input id="crop" value="80" inputmode="numeric"></div>
<label>Encoding</label><select id="speed"><option value="ultrafast">🚀 Ultra-Fast</option><option value="fast">⚖️ Balanced</option><option value="medium">💎 High Quality</option></select></section>
<section class="card"><h3>Process</h3><progress id="progress" value="0" max="100"></progress><div id="status" class="small" style="margin:8px 0">Ready</div><div class="row"><button class="btn green" id="start">🚀 Start Processing</button><button class="btn danger" id="clear">Clear</button></div></section>
<section class="card"><h3>Output</h3><div id="outputs" class="files"></div></section>
</main>
<script type="module">
import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import { fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';
const ff=new FFmpeg(); let loaded=false; const files=[];
const $=id=>document.getElementById(id);
function setStatus(s){$('status').textContent=s}
function refresh(){ $('fileList').innerHTML=files.map((f,i)=>`<div class="file"><span>${i+1}. ${f.name}</span><span class="status">${(f.size/1048576).toFixed(1)} MB</span></div>`).join('') }
$('picker').onchange=e=>{files.splice(0);files.push(...e.target.files);refresh();setStatus(`${files.length} video(s) selected`) };
$('method').onchange=()=>{const c=$('method').value==='crop';$('delogoBox').classList.toggle('hidden',c);$('cropBox').classList.toggle('hidden',!c);$('preset').disabled=c};
$('preset').onchange=()=>{const p=$('preset').value;const vals={dola:[540,1220,170,50],tiktok:[850,1700,200,80],top:[1650,50,220,100]};if(vals[p])[$('x').value,$('y').value,$('w').value,$('h').value]=vals[p];};
async function load(){if(loaded)return;setStatus('Loading FFmpeg…');await ff.load({coreURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.js',wasmURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.wasm'});loaded=true;$('engine').textContent='🟢 FFmpeg Engine Active';}
$('start').onclick=async()=>{if(!files.length){alert('Please select at least one video.');return}try{await load();$('start').disabled=true;$('outputs').innerHTML='';const method=$('method').value;let filter;if(method==='crop'){const n=parseInt($('crop').value,10);if(!Number.isFinite(n)||n<=0)throw Error('Invalid crop height');filter=`crop=iw:ih-${n}:0:0`}else{const x=parseInt($('x').value,10),y=parseInt($('y').value,10),w=parseInt($('w').value,10),h=parseInt($('h').value,10);if([x,y,w,h].some(n=>!Number.isFinite(n)||n<0))throw Error('Invalid coordinates');filter=`delogo=x=${x}:y=${y}:w=${w}:h=${h}`}
const preset=$('speed').value;for(let i=0;i<files.length;i++){const f=files[i], input=`input_${i}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`, output=`output_${i}.mp4`;setStatus(`Processing ${i+1}/${files.length}: ${f.name}`);$('progress').value=Math.round(i/files.length*100);await ff.writeFile(input,await fetchFile(f));await ff.exec(['-i',input,'-vf',filter,'-c:v','libx264','-preset',preset,'-crf',preset==='ultrafast'?'23':preset==='fast'?'20':'18','-c:a','copy','-movflags','+faststart',output]);const data=await ff.readFile(output);const blob=new Blob([data.buffer],{type:'video/mp4'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=f.name.replace(/\.[^.]+$/,'')+'_clean.mp4';a.textContent='⬇️ '+a.download;a.className='btn primary';a.style.display='block';a.style.marginTop='8px';$('outputs').appendChild(a);$('progress').value=Math.round((i+1)/files.length*100);try{await ff.deleteFile(input);await ff.deleteFile(output)}catch{} }setStatus(`Done — ${files.length} video(s) processed.`)}catch(e){console.error(e);setStatus('Error: '+e.message);alert(e.message)}finally{$('start').disabled=false}};
$('clear').onclick=()=>{files.splice(0);$('picker').value='';refresh();$('outputs').innerHTML='';$('progress').value=0;setStatus('Ready')};
</script></body></html>
